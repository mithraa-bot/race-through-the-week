<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Through the Week • Learning Arcade</title>
<style>
:root{--ink:#253653;--pink:#ffdeeb;--blue:#d9edff;--mint:#d9f5df;--yellow:#fff1b7}*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#fff6dd,#e5f3ff 52%,#ffe5f1);color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:4px solid #7252bc;outline-offset:2px}.wrap{max-width:1050px;margin:auto;padding:22px}.hero{border:3px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 7px 0 #b6c5d7;text-align:center;padding:20px}.hero h1{font-size:clamp(29px,5vw,48px);margin:5px 0}.hero p{margin:7px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}.chip{border:2px solid var(--ink);background:white;border-radius:22px;padding:10px 15px;font-weight:bold}.btn{background:#bce9d1;border:2px solid var(--ink);border-radius:15px;padding:12px 20px;font-weight:bold;box-shadow:0 3px 0 #9aaabd}.btn:hover,.game-card:hover{transform:translateY(-2px)}.btn:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.game-card{border:3px solid var(--ink);border-radius:22px;padding:25px;text-align:left;box-shadow:0 6px 0 #b9c8d4;background:white;min-height:205px}.game-card .emoji{font-size:45px}.game-card h2{margin:9px 0}.tag{display:inline-block;background:white;border:1px solid #7183a0;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:bold}.panel{border:3px solid var(--ink);border-radius:22px;background:white;padding:22px;box-shadow:0 6px 0 #bac7d8}.center{text-align:center}.muted{color:#596782}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px 0}.choice{border:2px solid var(--ink);border-radius:14px;background:#e8f2ff;padding:13px 20px;font-weight:bold;min-width:100px}.choice:hover{background:#d7e8ff}.feedback{min-height:55px;padding:12px;font-size:20px;font-weight:bold;text-align:center}.progress{height:13px;background:#e9edf4;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#75cda5;transition:width .2s}.tile{display:inline-flex;align-items:center;justify-content:center;min-width:46px;min-height:54px;border:2px solid var(--ink);border-radius:12px;background:#fff0b9;padding:10px;font-weight:bold;font-size:22px}.slots{min-height:72px;border:2px dashed #8997b1;border-radius:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px auto;max-width:720px}.space{border:2px solid #344664;border-radius:14px;min-height:82px;padding:8px;text-align:center;background:#e8f5ff;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:14px}.space:nth-child(3n){background:#ffe5f0}.space:nth-child(4n){background:#fff1b8}.space.active{outline:5px solid #64b78a;outline-offset:-5px}.bunny{font-size:27px;line-height:1.1}.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}.hidden{display:none!important}footer{text-align:center;color:#68748a;font-size:13px;margin:28px 0}.badge{display:inline-block;border-radius:50px;background:#fff1b7;padding:8px 12px;font-weight:bold}@media(max-width:620px){.cards{grid-template-columns:1fr}.wrap{padding:12px}.board{gap:4px}.space{min-height:68px;padding:4px;font-size:11px}.bunny{font-size:22px}.panel{padding:13px}}

/* Rainbow arcade makeover — visual styles only */
body{background:radial-gradient(circle at 8% 12%,#ffd1e7 0 9%,transparent 28%),radial-gradient(circle at 91% 24%,#c8f7e6 0 12%,transparent 31%),radial-gradient(circle at 55% 90%,#d4caff 0 12%,transparent 33%),linear-gradient(135deg,#fff0b6,#ccecff 48%,#ffdaee);background-attachment:fixed}
.hero{background:linear-gradient(115deg,#ffb8dc 0%,#ffe9a6 27%,#baf4d6 55%,#b6ddff 80%,#dac5ff 100%);border:3px solid #4b4773;box-shadow:0 9px 0 #a7a2cf}
.hero h1{color:#563c8f;text-shadow:2px 2px #fff}
.chip{background:linear-gradient(110deg,#fff4b7,#ffd4e9);border-color:#6b589a;box-shadow:0 3px 0 #bbaad6}
.btn{background:linear-gradient(120deg,#ffcf6d,#ff9fc6);border-color:#6e4d87;box-shadow:0 4px 0 #b97ba5;transition:transform .15s}
.btn:hover{background:linear-gradient(120deg,#ffe38b,#ffb1d3)}
.panel{background:linear-gradient(155deg,#fff6c9 0%,#fff1f9 43%,#e0f6ff 100%);border-color:#6e5793;box-shadow:0 7px 0 #c2a5d8}
.game-card{border-color:#63517f;box-shadow:0 7px 0 #aa9bc9;transition:transform .15s,box-shadow .15s}
.game-card:nth-child(1){background:linear-gradient(135deg,#c0f4c9,#fff5ae)!important}
.game-card:nth-child(2){background:linear-gradient(135deg,#a9d9ff,#d9c3ff)!important}
.game-card:nth-child(3){background:linear-gradient(135deg,#ffc1d9,#ffdfaa)!important}
.game-card:nth-child(4){background:linear-gradient(135deg,#fff2a2,#b8edff)!important}
.game-card:hover{box-shadow:0 9px 0 #aa9bc9}
.choice{background:linear-gradient(120deg,#c6edff,#dfd0ff);border-color:#6e5793;box-shadow:0 3px 0 #b4a4d4}
.choice:hover{background:linear-gradient(120deg,#aee3ff,#cfb7ff)}
.tile{background:linear-gradient(140deg,#ffeb9d,#ffc5da);border-color:#7b5888;box-shadow:0 3px 0 #cf9eb3}
.slots{background:#ffffffb8;border-color:#b47dce}
.space{background:linear-gradient(145deg,#aeeaff,#d6d1ff);border-color:#6c5595}
.space:nth-child(3n){background:linear-gradient(145deg,#ffc0df,#ffe0aa)}
.space:nth-child(4n){background:linear-gradient(145deg,#fff39f,#c6f4c9)}
.space.active{outline:5px solid #ff77ae;background:#fff6b3}
.progress{background:#fff;border:1px solid #c5b1d9}.progress>div{background:linear-gradient(90deg,#ff9bc9,#8cdaff,#8ce5ac)}
.badge{background:linear-gradient(90deg,#ffe68a,#ffc0e3);border:2px solid #9b74b4}
footer{color:#65517e;font-weight:bold}
</style></head><body><main class="wrap"><div class="hero"><div>🌈 YEAR 2 ENGLISH • DIGITAL LEARNING ARCADE 🌈</div><h1>🐰 Race Through the Week!</h1><p>Learn • Play • Explore the Days of the Week</p><p>✨ Choose any game — all four are unlocked! ✨</p></div><div class="top"><button class="btn" onclick="home()">🏠 Game Menu</button><div class="chip" id="globalStars">⭐ Total stars: 0</div><div class="chip" id="completed">🏅 Games completed: 0 / 4</div></div><section id="screen"></section></main>
<script>
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const games=[{id:'match',emoji:'🃏',title:'Match the Days',level:'BEGINNER',desc:'Choose the day that matches its position in the week.',bg:'#e0f6e8'},{id:'spell',emoji:'🔤',title:'Unscramble the Days',level:'MODERATE',desc:'Rearrange mixed-up letters to spell each day.',bg:'#e1edff'},{id:'sentence',emoji:'✏️',title:'Sentence Builder',level:'ADVANCED',desc:'Put words in order to make English sentences.',bg:'#ffe3ef'},{id:'board',emoji:'🎲',title:'Bunny Board Race',level:'MIXED LEVELS',desc:'Roll the dice, race and answer mixed challenges!',bg:'#fff0c8'}];
let stars={match:0,spell:0,sentence:0,board:0},done=new Set(),state={},current='';const el=document.getElementById('screen');
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(){document.getElementById('globalStars').textContent='⭐ Total stars: '+Object.values(stars).reduce((a,b)=>a+b,0);document.getElementById('completed').textContent='🏅 Games completed: '+done.size+' / 4'}
function award(n=1){stars[current]+=n;update()}function finish(){done.add(current);update();el.innerHTML=`<div class="panel center"><div style="font-size:65px">🏆🎉🐰</div><h2>Wonderful work!</h2><p>You completed <b>${games.find(g=>g.id===current).title}</b>!</p><p class="badge">⭐ Stars in this game: ${stars[current]}</p><div class="choices"><button class="btn" onclick="start('${current}')">🔁 Play Again</button><button class="btn" onclick="home()">🏠 Choose Another Game</button></div></div>`}
function home(){current='';el.innerHTML='<div class="center"><h2>🎮 Choose Your Learning Adventure!</h2><p class="muted">Start anywhere! Try a level that feels right for you.</p></div><div class="cards">'+games.map(g=>`<button class="game-card" style="background:${g.bg}" onclick="start('${g.id}')"><span class="emoji">${g.emoji}</span><h2>${g.title}</h2><span class="tag">${g.level}</span><p>${g.desc}</p><b>PLAY NOW →</b></button>`).join('')+'</div><p class="center muted">💗 Everyone can explore every level. Ask your teacher or a friend for help if needed.</p>'}
function start(id){current=id;stars[id]=0;state={index:0,locked:false,selected:[],position:0,turn:0,waiting:false};update();if(id==='match')match();if(id==='spell')spell();if(id==='sentence')sentence();if(id==='board')board()}
function shell(title,subtitle,content){el.innerHTML=`<div class="panel"><div class="center"><h2>${title}</h2><p class="muted">${subtitle}</p></div>${content}</div>`}
const matchQs=[{q:'Which day is the FIRST day of the school week?',a:'Monday',options:['Monday','Thursday','Sunday']},{q:'Which day comes AFTER Tuesday?',a:'Wednesday',options:['Friday','Wednesday','Monday']},{q:'Which day comes BEFORE Friday?',a:'Thursday',options:['Sunday','Thursday','Tuesday']},{q:'Which day comes AFTER Saturday?',a:'Sunday',options:['Wednesday','Sunday','Monday']},{q:'Which day comes BETWEEN Monday and Wednesday?',a:'Tuesday',options:['Thursday','Tuesday','Friday']}];
function match(){if(state.index>=matchQs.length)return finish();let q=matchQs[state.index];shell('🃏 Match the Days • Beginner',`Question ${state.index+1} of ${matchQs.length} • Choose the correct answer.`,`<div class="progress"><div style="width:${state.index/matchQs.length*100}%"></div></div><h2 class="center">${q.q}</h2><div class="choices">${shuffle(q.options).map(x=>`<button class="choice" onclick="checkMatch('${x}')">${x}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div>`)}
function checkMatch(x){let q=matchQs[state.index];if(x===q.a){award();state.index++;shell('⭐ Correct!','Great job! You earned one star.',`<div class="center"><button class="btn" onclick="match()">Next question ➜</button></div>`)}else document.getElementById('feedback').textContent='💗 Try again! Look carefully at the days.'}
const spellWords=['Monday','Friday','Sunday','Wednesday','Thursday'];
function spell(){if(state.index>=spellWords.length)return finish();let word=spellWords[state.index];state.selected=[];state.letters=shuffle([...word.toUpperCase()].map((letter,id)=>({letter,id})));spellDraw()}
function spellDraw(msg=''){let word=spellWords[state.index];shell('🔤 Unscramble the Days • Moderate',`Word ${state.index+1} of ${spellWords.length} • Tap the letters in the correct order.`,`<div class="progress"><div style="width:${state.index/spellWords.length*100}%"></div></div><p class="center">💡 Hint: This day has <b>${word.length}</b> letters. <button class="btn" onclick="hintSpell()">Show first letter</button></p><div class="slots" id="spellSlots">${state.selected.map(o=>`<span class="tile">${o.letter}</span>`).join('')||'Tap letters below'}</div><div class="choices">${state.letters.filter(o=>!state.selected.some(v=>v.id===o.id)).map(o=>`<button class="tile" onclick="pickLetter(${o.id})">${o.letter}</button>`).join('')}</div><div class="choices"><button class="btn" onclick="state.selected=[];spellDraw()">↩ Clear</button><button class="btn" onclick="checkSpell()">✓ Check spelling</button></div><div class="feedback" id="feedback" aria-live="polite">${msg}</div>`)}
function pickLetter(id){let o=state.letters.find(o=>o.id===id);if(o)state.selected.push(o);spellDraw()}function hintSpell(){spellDraw('💡 The first letter is '+spellWords[state.index][0].toUpperCase())}
function checkSpell(){if(state.selected.map(o=>o.letter).join('')===spellWords[state.index].toUpperCase()){award();state.index++;shell('⭐ Correct spelling!','Wonderful! You earned one star.',`<div class="center"><button class="btn" onclick="spell()">Next word ➜</button></div>`)}else spellDraw('💗 Not quite! Try arranging the letters again.')}
const sentences=[['I','play','football','on','Monday.'],['We','read','books','on','Tuesday.'],['I','ride','my','bike','on','Saturday.'],['She','draws','pictures','on','Sunday.']];
function sentence(){if(state.index>=sentences.length)return finish();state.selected=[];state.words=shuffle(sentences[state.index].map((word,id)=>({word,id})));sentenceDraw()}
function sentenceDraw(msg=''){shell('✏️ Sentence Builder • Advanced',`Sentence ${state.index+1} of ${sentences.length} • Tap words to build a correct sentence.`,`<div class="progress"><div style="width:${state.index/sentences.length*100}%"></div></div><p class="center">🗣️ Read your completed sentence aloud!</p><div class="slots">${state.selected.map(o=>`<span class="tile" style="font-size:17px">${esc(o.word)}</span>`).join('')||'Your sentence goes here'}</div><div class="choices">${state.words.filter(o=>!state.selected.some(v=>v.id===o.id)).map(o=>`<button class="choice" onclick="pickWord(${o.id})">${esc(o.word)}</button>`).join('')}</div><div class="choices"><button class="btn" onclick="state.selected=[];sentenceDraw()">↩ Clear</button><button class="btn" onclick="checkSentence()">✓ Check sentence</button></div><div class="feedback" id="feedback" aria-live="polite">${msg}</div>`)}
function pickWord(id){state.selected.push(state.words.find(o=>o.id===id));sentenceDraw()}
function checkSentence(){if(state.selected.map(o=>o.id).join(',')===sentences[state.index].map((_,i)=>i).join(',')){const completed=sentences[state.index].join(' ');award();state.index++;shell('⭐ Excellent Sentence!','🗣️ Now read your completed sentence aloud!',`<div class="center"><div style="background:linear-gradient(120deg,#fff1bb,#ffe2f1,#d9efff);border:3px solid #7956a1;border-radius:22px;padding:28px 16px;margin:22px auto;max-width:760px"><div style="font-size:17px;margin-bottom:12px">✨ Your sentence ✨</div><div style="font-size:clamp(24px,4vw,37px);font-weight:800;line-height:1.4">${esc(completed)}</div></div><p style="font-size:20px;font-weight:bold">⭐ +1 Star! Great job!</p><p>Read it aloud before continuing. 🎤</p><button class="btn" onclick="sentence()">${state.index>=sentences.length?'🏆 Finish Game':'Next Sentence ➜'}</button></div>`)}else sentenceDraw('💗 Try again! Remember: Who + action + when.')}
const boardQs=[{q:'What day comes after Monday?',opts:['Tuesday','Friday','Sunday'],a:'Tuesday'},{q:'Which day comes before Saturday?',opts:['Thursday','Friday','Monday'],a:'Friday'},{q:'MON, TUE, ___, THU',opts:['Sunday','Wednesday','Friday'],a:'Wednesday'},{q:'Which word is spelled correctly?',opts:['Thrusday','Thursday','Thurday'],a:'Thursday'},{q:'Choose the correct sentence.',opts:['I play on Sunday.','On play I Sunday.','Sunday on I play.'],a:'I play on Sunday.'},{q:'What day comes after Friday?',opts:['Saturday','Tuesday','Monday'],a:'Saturday'},{q:'Which day comes before Tuesday?',opts:['Sunday','Monday','Friday'],a:'Monday'},{q:'Choose the correct sentence.',opts:['We read on Wednesday.','Read Wednesday we on.','On we Wednesday read.'],a:'We read on Wednesday.'}];
function board(){let path=['START',...days,...days,'MON','FINISH'];let content=`<div class="stats"><span class="chip">🐰 Space: ${state.position} / 16</span><span class="chip">🎲 Turn: ${state.turn}</span><span class="chip">⭐ Stars: ${stars.board}</span></div><div class="board">${path.map((name,i)=>`<div class="space ${state.position===i?'active':''}"><b>${i===0?'START':i===16?'🏆 FINISH':i}</b><span>${name}</span>${state.position===i?'<span class="bunny">🐰</span>':''}</div>`).join('')}</div><div class="center"><p id="rollText">${state.position===0?'Ready, bunny? Roll the dice!':'Keep going! Reach FINISH to win!'}</p><button class="btn" id="rollBtn" onclick="roll()" ${state.waiting?'disabled':''}>🎲 ROLL DICE</button></div><div id="challenge" aria-live="polite"></div>`;shell('🐰 Bunny Board Race • Mixed Levels','Roll 1–6, move your bunny and answer a challenge to earn a star.',content)}
function roll(){if(state.waiting||state.position>=16)return;let n=Math.floor(Math.random()*6)+1;state.turn++;state.waiting=true;let target=Math.min(16,state.position+n);document.getElementById('rollBtn').disabled=true;document.getElementById('rollText').textContent=`🎲 You rolled ${n}! Bunny moves ${target-state.position} space(s).`;let steps=target-state.position;function move(){if(steps>0){state.position++;steps--;let spaces=document.querySelectorAll('.space');spaces.forEach((s,i)=>{s.classList.toggle('active',i===state.position);s.querySelector('.bunny')?.remove();if(i===state.position)s.insertAdjacentHTML('beforeend','<span class="bunny">🐰</span>')});setTimeout(move,210)}else{if(state.position>=16){state.waiting=false;finish();return}showBoardQuestion()}}move()}
function showBoardQuestion(){let q=boardQs[(state.turn-1)%boardQs.length];document.getElementById('challenge').innerHTML=`<div class="panel center" style="margin-top:18px;background:#fff9df"><h3>🧠 Challenge ${state.turn}</h3><h2>${q.q}</h2><div class="choices">${shuffle(q.opts).map(o=>`<button class="choice" onclick="boardAnswer('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div id="boardFeedback" class="feedback"></div></div>`}
function boardAnswer(ans){let q=boardQs[(state.turn-1)%boardQs.length];if(ans===q.a){award();state.waiting=false;document.getElementById('challenge').innerHTML='<div class="feedback">⭐ Correct! +1 star! Roll again!</div>';document.getElementById('rollBtn').disabled=false}else document.getElementById('boardFeedback').textContent='💗 Try again! You can do it!'}
home();
</script></body></html>
